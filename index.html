<!DOCTYPE html>
<!--
  Grim Dawn Build Calculator — build-first, overlay-driven SPA.
  data.js is GENERATED by build-data.mjs (window.GD_DATA); never hand-edit it.

  Architecture (see the build-calc-planner references):
    - Build-first: the home screen is the paperdoll (mastery picker + gear slots).
    - Clicking a slot opens an item SELECTOR overlay (#overlay-root).
    - #detail-overlay-root stacks ABOVE for item/trait detail pages.
    - Overlays are statically sized; scroll is preserved on every re-render.
    - Traits are DATA (damage types); a trait×gear cross-reference matrix
      surfaces which equipped pieces share a damage type.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grim Dawn Build Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>

  <!-- Overlay layers: #overlay-root = selectors (z100); #detail-overlay-root stacks above (z200) -->
  <div id="overlay-root" class="hidden" aria-hidden="true"></div>
  <div id="detail-overlay-root" class="hidden" aria-hidden="true"></div>

  <!-- data.js defines window.GD_DATA and must load before app.js -->
  <script src="data.js"></script>
  <script src="app.js" defer></script>

  <!-- Cloudflare Web Analytics — ACTIVE (public release). Shared misterwtheface-oss.github.io
       hostname token; filter by page path in the CF dashboard. -->
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "b5abb0125b524ee8a96efbe9899114a4"}'></script>
</body>
</html>
